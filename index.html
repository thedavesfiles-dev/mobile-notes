<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151a1f">
<title>Football Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<header>
  <div class="eyebrow">FOOTBALL INTELLIGENCE</div>
  <h1>MOBILE NOTES</h1>
  <div class="sub">Captura ahora · Data Check después</div>
</header>
<main>
  <section class="card form">
    <label>TEAM</label><select id="team"></select>
    <label>UNIT <span>opcional</span></label>
    <div class="units">
      <button data-unit="GENERAL" class="active">GENERAL</button>
      <button data-unit="OFFENSE">OFF</button>
      <button data-unit="DEFENSE">DEF</button>
      <button data-unit="SPECIAL">ST</button>
    </div>
    <label>OBSERVATION</label>
    <textarea id="text" placeholder="Ej: Denver sigue regalando el pase profundo..."></textarea>
    <div class="context-row">
      <input id="opponent" maxlength="3" placeholder="RIVAL (opcional)">
      <input id="week" inputmode="numeric" placeholder="WEEK">
    </div>
    <button id="save" class="primary">GUARDAR NOTA</button>
    <div id="savedFlash" class="flash"></div>
  </section>
  <section class="toolbar">
    <div><b id="pendingCount">0</b> pendientes</div>
    <button id="export" class="secondary">EXPORTAR PENDIENTES</button>
  </section>
  <section id="notes"></section>
  <section class="card help">
    <b>Flujo</b>
    <p>Escribe libremente mientras ves un partido. No necesitas clasificar perfectamente la nota.</p>
    <p>En casa: Exportar pendientes → Team Archetype Lab → Import Mobile Notes.</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
